---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-hello
  namespace: nginx-hello
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-hello
  template:
    metadata:
      labels:
        app: nginx-hello
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          # Simple hack to make Nginx say Hello World without a custom image
          command: ["/bin/sh", "-c"]
          args:
            - echo "Hello World from OKD!" > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'
